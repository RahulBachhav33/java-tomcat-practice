apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-tomcat-practice
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: java-tomcat-practice
  template:
    metadata:
      labels:
        app: java-tomcat-practice
    spec:
      containers:
        - name: java-tomcat-practice
          image: IMAGE_URI_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: "ENVIRONMENT_PLACEHOLDER"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: java-tomcat-practice
spec:
  type: ClusterIP
  selector:
    app: java-tomcat-practice
  ports:
    - name: http
      port: 80
      targetPort: 8080
